[project]
name = "qcfinancial-docs"
version = "0.1.0"
description = "Documentation notebooks and static-site builder for the qcfinancial library."
readme = "README.md"
requires-python = ">=3.12"
# The docs toolchain (CLI + converter) is pure standard library, so the project
# itself has no install-time runtime dependencies. See dependency-groups below.
dependencies = []

[project.scripts]
# `uv run qcf-docs notebooks`  -> regenerate docs/*.md from the .ipynb
# `uv run qcf-docs build`      -> build the static HTML site into site/
qcf-docs = "qcfdocs.cli:main"

[project.optional-dependencies]
# The notebook *execution* surface -- only needed to RE-RUN the chapter notebooks
# in Jupyter. Install on demand: `uv sync --extra notebooks`.
# NOTE: qcfinancial 1.14.0a2 is a pre-release published only on TestPyPI (see
# [tool.uv.sources] below), and it ships wheels for macOS x86_64 ONLY -- no arm64,
# no Windows, no Linux. So `uv sync --extra notebooks` only works on Intel macOS.
# The core build (`uv sync` without this extra) never needs it, so Linux CI is
# unaffected.
notebooks = [
    "qcfinancial==1.14.0a2",
    "pandas",
    "numpy",
    "holidays",
    "openpyxl",   # ch4 reads input/*.xlsx via pandas.read_excel
    "pydantic",   # used by qcf_wrappers.py
]

[dependency-groups]
# The docs build toolchain, installed by default by `uv sync`. nbconvert reads
# the .ipynb JSON as-is, so none of this needs qcfinancial.
dev = [
    "nbconvert",
    "jupyterlab",
    "ipykernel",
    "pytest",
]

[tool.uv]
# qcfinancial 1.14.0a2 is a pre-release; allow it without loosening anything else.
prerelease = "explicit"

[[tool.uv.index]]
# `explicit = true` means NOTHING resolves from here unless pinned to it in
# [tool.uv.sources] -- TestPyPI mirrors are stale/incomplete, so pandas, numpy,
# and everything else must keep coming from real PyPI.
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
qcfinancial = { index = "testpypi" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qcfdocs"]
